[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapnque"
version = "2.0.0"
description = "Queue Management and Student Kiosk Ticketing System for Educational Institutions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "TapNQue Team" }
]
keywords = ["queue-management", "pyside6", "kiosk", "ticketing-system", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.5.0",
    "qrcode>=8.0.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
tapnque = "tapnque.ui.launcher:main"
tapnque-kiosk = "tapnque.ui.kiosk:main"
tapnque-monitor = "tapnque.ui.monitor:main"
tapnque-staff = "tapnque.ui.staff:main"
tapnque-admin = "tapnque.ui.super_admin:main"
tapnque-passwd = "tapnque.cli.set_admin_password:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
